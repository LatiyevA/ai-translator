name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt runtime on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install Qt X11 dependencies
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          sudo apt-get install -y xvfb xauth libgl1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0
      - run: python -m pip install uv==0.13.9
      - run: uv build --wheel --out-dir dist
      - run: uv sync --locked --extra desktop --no-install-project --python ${{ matrix.python }}
      - name: Install and check the built package
        run: |
          uv pip install --no-deps --no-index --find-links dist ai-translator
          uv run --no-sync ai-translator --help
          uv run --no-sync ai-translator-desktop --help
      - name: Verify Qt is available
        run: uv run --no-sync python -c "from ai_translator.desktop import QApplication; assert QApplication is not None"
      - name: Check the desktop extra outside the repository
        if: runner.os == 'Linux' && matrix.python == '3.12'
        shell: bash
        env:
          PYTHONIOENCODING: cp1252
        run: |
          wheel="$(realpath dist/*.whl)"
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/ai-translator-wheel.XXXXXX")"
          cd "$smoke_dir"
          uv venv --python 3.12 env
          uv pip install --python env/bin/python "$wheel[desktop]"
          env/bin/python -c 'from ai_translator.desktop import QApplication; assert QApplication is not None'
          cli_help="$(env/bin/ai-translator --help)"
          desktop_help="$(env/bin/ai-translator-desktop --help)"
          [[ "$cli_help" == *"Литературный перевод"* ]]
          [[ "$desktop_help" == *"Десктопное приложение"* ]]
          printf '雨\n' > '-雨 книга.txt'
          env/bin/ai-translator inspect --json-events --for sample --no-auto-glossary -- '-雨 книга.txt' |
            env/bin/python -c 'import json, sys; events = {r["event"]: r for r in map(json.loads, sys.stdin.buffer)}; assert events["sample_range"]["opening"] == "雨"'
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Test Qt desktop on X11
        if: runner.os == 'Linux' && matrix.python == '3.12'
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          plugin="$(uv run --no-sync python -c 'from PySide6.QtCore import QLibraryInfo as Q; print(Q.path(Q.LibraryPath.PluginsPath) + "/platforms/libqxcb.so")')"
          dependencies="$(ldd "$plugin")"
          if [[ "$dependencies" == *"not found"* ]]; then
            printf '%s\n' "$dependencies"
            exit 1
          fi
          xvfb-run -a uv run --no-sync python -m unittest discover -s tests -p test_desktop.py -v
