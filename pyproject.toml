[project]
name = "ai-translator"
version = "0.1.0"
description = "Литературный перевод книг с китайского на русский"
readme = "README.md"
authors = [{ name = "latieyva", email = "abilailat@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["lxml>=5.4,<7"]

[project.scripts]
ai-translator = "ai_translator.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
