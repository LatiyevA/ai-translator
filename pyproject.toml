[project]
name = "ai-translator"
version = "0.1.0"
description = "Translates text using AI models."
readme = "README.md"
authors = [
    { name = "latieyva", email = "abilailat@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "openai>=3.33.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
ai-translator = "ai_translator:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
